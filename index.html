<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qlix 2 (ALPHA)</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{ --panel: rgba(255,255,255,0.15); --radius: 16px; --shadow: 0 8px 24px rgba(0,0,0,0.35); }
body{ margin:0; font-family:'Comfortaa',sans-serif; background:#547538; color:black; overflow-x:hidden; }
.topbar{ position:sticky; top:0; backdrop-filter:blur(10px); background:black; padding:10px 16px; display:flex; align-items:center; gap:10px; z-index:10; }
.logo{ font-weight:800; color:white; }
.wrap{ display:grid; grid-template-columns:260px 1fr; gap:16px; max-width:1100px; margin:14px auto; padding:0 16px; }
@media(max-width:640px){ .wrap{ grid-template-columns:1fr; } }
.card,.composer,.post{ background:var(--panel); padding:14px; border-radius:var(--radius); box-shadow:var(--shadow); }
.feed{ display:grid; gap:12px; }
.profile-pic{ width:32px; height:32px; border-radius:50%; object-fit:cover; background:#ccc; cursor:pointer; }
.btn{ padding:8px 12px; border-radius:12px; border:none; cursor:pointer; font-family:inherit; position:relative; }
.btn-sm{ padding:4px 8px; border-radius:8px; font-size:11px; }
.primary{ background:white; color:#547538; font-weight:700; }
textarea,input[type="text"]{ width:100%; box-sizing:border-box; padding:10px; border-radius:12px; border:none; background:rgba(255,255,255,0.8); font-family:inherit; }
textarea{ min-height:70px; margin-bottom:8px; }
.user-card{ display:flex; flex-direction:column; gap:10px; align-items:center; text-align:center; }
.author-link{ display:flex; gap:10px; align-items:center; cursor:pointer; }
.author-link:hover strong{ text-decoration:underline; }

/* Notification Badge */
.notif-badge {
  position: absolute; top: -4px; right: -4px; background: #e74c3c; color: white;
  font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; display: none;
}

/* DM & Notification Drawer Styles */
.dm-drawer {
  position: fixed; top: 0; right: -360px; width: 340px; height: 100vh;
  background: white; box-shadow: -4px 0 20px rgba(0,0,0,0.3); z-index: 100;
  transition: right 0.3s ease; display: flex; flex-direction: column;
}
.dm-drawer.open { right: 0; }
.dm-header { padding: 14px; background: #333; color: white; display: flex; justify-content: space-between; align-items: center; }
.dm-body { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #f5f5f5; }
.dm-footer { padding: 10px; background: #eee; display: flex; gap: 8px; }
.dm-bubble { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.3; }
.dm-bubble.sent { align-self: flex-end; background: #547538; color: white; }
.dm-bubble.received { align-self: flex-start; background: #e0e0e0; color: black; }

/* Notification List Items */
.notif-item {
  background: white; padding: 10px; border-radius: 8px; border: 1px solid #ddd;
  cursor: pointer; display: flex; flex-direction: column; gap: 4px;
}
.notif-item:hover { background: #f0f0f0; }
.notif-title { font-weight: bold; font-size: 12px; color: #333; }
.notif-snippet { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Profile Modal & Header Banner Styles */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6); display: none; align-items: center;
  justify-content: center; z-index: 90;
}
.modal-overlay.open { display: flex; }
.profile-modal {
  background: white; border-radius: var(--radius); width: 90%; max-width: 360px;
  overflow: hidden; box-shadow: 0 12px 32px rgba(0,0,0,0.4); position: relative;
}
.header-banner {
  height: 100px; background: #88a76d; background-size: cover; background-position: center; position: relative;
}
.profile-avatar-wrapper {
  position: absolute; bottom: -35px; left: 50%; transform: translateX(-50%);
}
.profile-avatar-wrapper img {
  width: 70px; height: 70px; border-radius: 50%; border: 4px solid white; object-fit: cover; background: #ccc;
}
.modal-body {
  padding: 45px 20px 20px; text-align: center; display: flex; flex-direction: column; gap: 8px;
}
.profile-bio { font-size: 13px; color: #555; margin: 4px 0 10px; line-height: 1.4; white-space: pre-line; }
.close-modal {
  position: absolute; top: 10px; right: 12px; background: rgba(0,0,0,0.4);
  border: none; color: white; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; z-index: 2;
}

.edit-form { display: none; flex-direction: column; gap: 8px; text-align: left; margin-top: 10px; }
.edit-form label { font-size: 11px; font-weight: bold; color: #444; }
.edit-form input, .edit-form textarea { font-size: 12px; background: #f0f0f0; margin-bottom: 0; }
.status-msg { font-size: 11px; font-weight: bold; margin-top: 4px; }
.status-msg.error { color: #d9534f; }
.status-msg.success { color: #5cb85c; }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">Qlix 2 (ALPHA)</div>
  <div style="margin-left:auto; display:flex; gap:8px;">
    <button class="btn" id="notifBtn" style="display:none;">
      🔔 Direct Messages
      <span class="notif-badge" id="notifBadge">0</span>
    </button>
    <button class="btn" id="googleSignInBtn">Sign in with Google</button>
    <button class="btn" id="signOutBtn" style="display:none;">Sign Out</button>
  </div>
</header>

<main class="wrap">
  <aside>
    <div class="card user-card" id="userInfo" style="display:none;">
      <img id="userPic" class="profile-pic" style="width: 64px; height: 64px;" alt="Profile Picture">
      <strong id="userName"></strong>
      <button class="btn primary btn-sm" id="viewMyProfileBtn">View My Profile</button>
    </div>
  </aside>

  <section>
    <div class="card composer" id="composer" style="display:none;">
      <textarea id="postText" placeholder="What's on your mind?"></textarea>
      <button class="btn primary" id="postBtn">Post</button>
    </div>
    <div class="feed" id="feed"></div>
  </section>
</main>

<!-- Profile Modal -->
<div class="modal-overlay" id="profileModal">
  <div class="profile-modal">
    <button class="close-modal" id="closeProfileModal">✕</button>
    
    <div class="header-banner" id="modalHeaderBanner">
      <div class="profile-avatar-wrapper">
        <img id="modalProfilePic" src="https://via.placeholder.com/70">
      </div>
    </div>

    <div class="modal-body">
      <h3 id="modalProfileName" style="margin: 0;">User Name</h3>
      <div class="profile-bio" id="modalProfileBio">No bio added yet.</div>

      <!-- Actions -->
      <button class="btn primary" id="modalMessageBtn" style="width: 100%;">✉ Send Message</button>
      <button class="btn btn-sm" id="toggleEditBtn" style="width: 100%; display: none; background: #eee;">Edit Profile</button>

      <!-- Edit Profile Form -->
      <div class="edit-form" id="editForm">
        <label>Profile Picture URL</label>
        <input type="text" id="editAvatarInput" placeholder="https://example.com/avatar.jpg">

        <label>Display Name</label>
        <input type="text" id="editNameInput">

        <label>Bio</label>
        <textarea id="editBioInput" placeholder="Tell us about yourself..."></textarea>

        <label>Header Image URL</label>
        <input type="text" id="editHeaderInput" placeholder="https://example.com/banner.jpg">

        <button class="btn primary btn-sm" id="saveProfileBtn" style="margin-top: 6px;">Save Changes</button>
        <div class="status-msg" id="uploadStatus"></div>
      </div>
    </div>
  </div>
</div>

<!-- DM Drawer -->
<div class="dm-drawer" id="dmDrawer">
  <div class="dm-header">
    <span id="dmTargetName">Chat</span>
    <button class="btn btn-sm" id="closeDmBtn" style="background:#555; color:white;">✕ Close</button>
  </div>
  <div class="dm-body" id="dmBody"></div>
  <div class="dm-footer" id="dmFooter">
    <input type="text" id="dmInput" placeholder="Type a message...">
    <button class="btn primary btn-sm" id="sendDmBtn">Send</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, serverTimestamp, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDP0yDxmCrcIXK_DkdXJZB_XzPRVPXMCyo",
  authDomain: "qlix-2701b.firebaseapp.com",
  projectId: "qlix-2701b",
  storageBucket: "qlix-2701b.appspot.com"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let activeChatUserId = null;
let dmUnsubscribe = null;
let notifUnsubscribe = null;

// Auth
document.getElementById("googleSignInBtn").onclick = () => signInWithPopup(auth, provider);
document.getElementById("signOutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  currentUser = user;
  document.getElementById("googleSignInBtn").style.display = user ? "none" : "inline-block";
  document.getElementById("signOutBtn").style.display = user ? "inline-block" : "none";
  document.getElementById("notifBtn").style.display = user ? "inline-block" : "none";
  document.getElementById("composer").style.display = user ? "block" : "none";
  document.getElementById("userInfo").style.display = user ? "flex" : "none";
  
  if (user) {
    const userRef = doc(db, "users", user.uid);
    const snap = await getDoc(userRef);
    let photoURL = user.photoURL;

    if (!snap.exists()) {
      await setDoc(userRef, {
        displayName: user.displayName || user.email,
        photoURL: user.photoURL || "",
        bio: "",
        headerUrl: ""
      }, { merge: true });
    } else {
      const data = snap.data();
      if (data.photoURL) photoURL = data.photoURL;
    }

    document.getElementById("userPic").src = photoURL || "https://via.placeholder.com/64";
    document.getElementById("userName").textContent = user.displayName || user.email;

    listenForNotifications();
  } else {
    if (notifUnsubscribe) notifUnsubscribe();
  }
  fetchFeed();
});

document.getElementById("viewMyProfileBtn").onclick = () => {
  if (currentUser) openUserProfile(currentUser.uid, currentUser.displayName || currentUser.email, currentUser.photoURL);
};

// Profile Modal & Edit Handlers
async function openUserProfile(authorId, authorName, authorPic) {
  document.getElementById("editForm").style.display = "none";
  document.getElementById("toggleEditBtn").textContent = "Edit Profile";
  document.getElementById("uploadStatus").textContent = "";
  
  const userSnap = await getDoc(doc(db, "users", authorId));
  const userData = userSnap.exists() ? userSnap.data() : {};

  const name = userData.displayName || authorName;
  const pic = userData.photoURL || authorPic || "https://via.placeholder.com/70";
  const bio = userData.bio || "No bio added yet.";
  const headerUrl = userData.headerUrl || "";

  document.getElementById("modalProfilePic").src = pic;
  document.getElementById("modalProfileName").textContent = name;
  document.getElementById("modalProfileBio").textContent = bio;
  
  const bannerEl = document.getElementById("modalHeaderBanner");
  bannerEl.style.backgroundImage = headerUrl ? `url('${headerUrl}')` : 'none';

  const msgBtn = document.getElementById("modalMessageBtn");
  const editBtn = document.getElementById("toggleEditBtn");

  msgBtn.onclick = () => {
    document.getElementById("profileModal").classList.remove("open");
    openChat(authorId, name);
  };

  if (currentUser && currentUser.uid === authorId) {
    msgBtn.style.display = "none";
    editBtn.style.display = "block";
    
    document.getElementById("editAvatarInput").value = userData.photoURL || authorPic || "";
    document.getElementById("editNameInput").value = name;
    document.getElementById("editBioInput").value = userData.bio || "";
    document.getElementById("editHeaderInput").value = headerUrl;
  } else {
    msgBtn.style.display = "block";
    editBtn.style.display = "none";
  }

  document.getElementById("profileModal").classList.add("open");
}

document.getElementById("closeProfileModal").onclick = () => {
  document.getElementById("profileModal").classList.remove("open");
};

document.getElementById("toggleEditBtn").onclick = () => {
  const form = document.getElementById("editForm");
  const isHidden = form.style.display === "none" || !form.style.display;
  form.style.display = isHidden ? "flex" : "none";
  document.getElementById("toggleEditBtn").textContent = isHidden ? "Cancel Editing" : "Edit Profile";
};

// Save Profile via Text URL
document.getElementById("saveProfileBtn").onclick = async () => {
  if (!currentUser) return;
  
  const saveBtn = document.getElementById("saveProfileBtn");
  const statusEl = document.getElementById("uploadStatus");
  saveBtn.disabled = true;
  saveBtn.textContent = "Saving...";

  try {
    const photoURL = document.getElementById("editAvatarInput").value.trim();
    const newName = document.getElementById("editNameInput").value.trim();
    const newBio = document.getElementById("editBioInput").value.trim();
    const newHeader = document.getElementById("editHeaderInput").value.trim();

    // Update Firestore user document
    await setDoc(doc(db, "users", currentUser.uid), {
      displayName: newName || currentUser.email,
      photoURL: photoURL,
      bio: newBio,
      headerUrl: newHeader
    }, { merge: true });

    // Update Firebase Auth profile
    await updateProfile(currentUser, { 
      displayName: newName || currentUser.email,
      photoURL: photoURL 
    });

    document.getElementById("userPic").src = photoURL || "https://via.placeholder.com/64";
    document.getElementById("userName").textContent = newName || currentUser.email;

    statusEl.className = "status-msg success";
    statusEl.textContent = "Profile updated!";

    setTimeout(() => {
      openUserProfile(currentUser.uid, newName || currentUser.email, photoURL);
      fetchFeed();
    }, 600);

  } catch (err) {
    console.error("Profile save error:", err);
    statusEl.className = "status-msg error";
    statusEl.textContent = "Error saving profile.";
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "Save Changes";
  }
};

// DM Notifications Listener
function listenForNotifications() {
  if (!currentUser) return;

  const q = query(
    collection(db, "direct_messages"),
    where("participants", "array-contains", currentUser.uid)
  );

  notifUnsubscribe = onSnapshot(q, (snapshot) => {
    const unreadMap = new Map();

    snapshot.forEach(doc => {
      const data = doc.data();
      if (data.senderId !== currentUser.uid) {
        const otherId = data.senderId;
        const existing = unreadMap.get(otherId);
        
        if (!existing || (data.timestamp?.toMillis() || 0) > (existing.timestamp?.toMillis() || 0)) {
          unreadMap.set(otherId, data);
        }
      }
    });

    const notifBadge = document.getElementById("notifBadge");
    const count = unreadMap.size;

    if (count > 0) {
      notifBadge.textContent = count;
      notifBadge.style.display = "inline-block";
    } else {
      notifBadge.style.display = "none";
    }
  });
}

// Open Notifications Panel
document.getElementById("notifBtn").onclick = async () => {
  if (!currentUser) return;

  document.getElementById("dmTargetName").textContent = "Notifications & Messages";
  document.getElementById("dmFooter").style.display = "none";
  const dmBody = document.getElementById("dmBody");
  dmBody.innerHTML = "<p style='font-size:12px; color:#666;'>Loading messages...</p>";

  document.getElementById("dmDrawer").classList.add("open");

  const q = query(
    collection(db, "direct_messages"),
    where("participants", "array-contains", currentUser.uid)
  );

  const snapshot = await getDocs(q);
  const convos = new Map();

  snapshot.forEach(doc => {
    const data = doc.data();
    const otherId = data.participants.find(id => id !== currentUser.uid);
    if (otherId) {
      const existing = convos.get(otherId);
      if (!existing || (data.timestamp?.toMillis() || 0) > (existing.timestamp?.toMillis() || 0)) {
        convos.set(otherId, { ...data, otherId });
      }
    }
  });

  dmBody.innerHTML = "";
  if (convos.size === 0) {
    dmBody.innerHTML = "<p style='font-size:12px; color:#666;'>No active direct messages.</p>";
    return;
  }

  const sortedConvos = Array.from(convos.values()).sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));

  for (const item of sortedConvos) {
    const userSnap = await getDoc(doc(db, "users", item.otherId));
    const userData = userSnap.exists() ? userSnap.data() : {};
    const name = userData.displayName || item.senderName || "User";

    const div = document.createElement("div");
    div.className = "notif-item";
    div.innerHTML = `
      <div class="notif-title">💬 ${name}</div>
      <div class="notif-snippet">${item.text}</div>
    `;
    div.onclick = () => openChat(item.otherId, name);
    dmBody.appendChild(div);
  }
};

// Direct Chat Window
function openChat(targetUserId, targetUserName) {
  if (!currentUser) return alert("Please sign in to message users.");
  if (currentUser.uid === targetUserId) return alert("You cannot DM yourself.");

  activeChatUserId = targetUserId;
  document.getElementById("dmTargetName").textContent = `Chat with ${targetUserName}`;
  document.getElementById("dmFooter").style.display = "flex";
  document.getElementById("dmDrawer").classList.add("open");

  if (dmUnsubscribe) dmUnsubscribe();

  const q = query(
    collection(db, "direct_messages"),
    where("participants", "array-contains", currentUser.uid)
  );

  dmUnsubscribe = onSnapshot(q, (snapshot) => {
    const dmBody = document.getElementById("dmBody");
    dmBody.innerHTML = "";

    const messages = [];
    snapshot.forEach(doc => {
      const data = doc.data();
      if (data.participants.includes(targetUserId)) {
        messages.push(data);
      }
    });

    messages.sort((a, b) => (a.timestamp?.toMillis() || Date.now()) - (b.timestamp?.toMillis() || Date.now()));

    messages.forEach(msg => {
      const bubble = document.createElement("div");
      bubble.className = `dm-bubble ${msg.senderId === currentUser.uid ? 'sent' : 'received'}`;
      bubble.textContent = msg.text;
      dmBody.appendChild(bubble);
    });

    dmBody.scrollTop = dmBody.scrollHeight;
  });
}

document.getElementById("closeDmBtn").onclick = () => {
  document.getElementById("dmDrawer").classList.remove("open");
  if (dmUnsubscribe) dmUnsubscribe();
};

document.getElementById("sendDmBtn").onclick = async () => {
  const input = document.getElementById("dmInput");
  const text = input.value.trim();
  if (!text || !activeChatUserId || !currentUser) return;

  await addDoc(collection(db, "direct_messages"), {
    senderId: currentUser.uid,
    receiverId: activeChatUserId,
    participants: [currentUser.uid, activeChatUserId],
    senderName: currentUser.displayName || currentUser.email,
    text: text,
    timestamp: serverTimestamp()
  });

  input.value = "";
};

// Feed & Posts
async function fetchFeed() {
  const feed = document.getElementById("feed");
  const snapshot = await getDocs(collection(db, "posts"));
  feed.innerHTML = "";

  const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  docs.sort((a, b) => (b.timestamp?.toMillis() || Date.now()) - (a.timestamp?.toMillis() || Date.now()));

  for (const data of docs) {
    let pic = data.authorPic || "https://via.placeholder.com/32";
    let name = data.authorName;

    if (data.authorId) {
      const uSnap = await getDoc(doc(db, "users", data.authorId));
      if (uSnap.exists()) {
        const uData = uSnap.data();
        if (uData.photoURL) pic = uData.photoURL;
        if (uData.displayName) name = uData.displayName;
      }
    }

    const div = document.createElement("div");
    div.className = "post";
    div.innerHTML = `
      <div class="author-link">
        <img class="profile-pic" src="${pic}">
        <strong>${name}</strong>
      </div>
      <p>${data.text}</p>
    `;

    const authorLink = div.querySelector(".author-link");
    authorLink.onclick = () => openUserProfile(data.authorId, name, pic);

    feed.appendChild(div);
  }
}

document.getElementById("postBtn").onclick = async () => {
  const input = document.getElementById("postText");
  if (!input.value.trim() || !currentUser) return;
  
  await addDoc(collection(db, "posts"), {
    text: input.value.trim(),
    authorName: currentUser.displayName || currentUser.email,
    authorId: currentUser.uid,
    authorPic: currentUser.photoURL || "",
    timestamp: serverTimestamp()
  });
  
  input.value = "";
  fetchFeed();
};
</script>
</body>
</html>
