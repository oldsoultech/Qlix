<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qlix 2 (ALPHA)</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{ --panel: rgba(255,255,255,0.15); --radius: 16px; --shadow: 0 8px 24px rgba(0,0,0,0.35); }
body{ margin:0; font-family:'Comfortaa',sans-serif; background:#547538; color:black; overflow-x:hidden; }
.topbar{ position:sticky; top:0; backdrop-filter:blur(10px); background:black; padding:10px 16px; display:flex; align-items:center; gap:10px; z-index:10; }
.logo{ font-weight:800; color:white; }
.wrap{ display:grid; grid-template-columns:260px 1fr; gap:16px; max-width:1100px; margin:14px auto; padding:0 16px; }
@media(max-width:640px){ .wrap{ grid-template-columns:1fr; } }
.card,.composer,.post{ background:var(--panel); padding:14px; border-radius:var(--radius); box-shadow:var(--shadow); }
.feed{ display:grid; gap:12px; }
.profile-pic{ width:32px; height:32px; border-radius:50%; object-fit:cover; background:#ccc; cursor:pointer; }
.btn{ padding:8px 12px; border-radius:12px; border:none; cursor:pointer; font-family:inherit; }
.btn-sm{ padding:4px 8px; border-radius:8px; font-size:11px; }
.primary{ background:white; color:#547538; font-weight:700; }
textarea,input[type="text"]{ width:100%; box-sizing:border-box; padding:10px; border-radius:12px; border:none; background:rgba(255,255,255,0.8); font-family:inherit; }
textarea{ min-height:70px; margin-bottom:8px; }
.user-card{ display:flex; flex-direction:column; gap:10px; align-items:center; text-align:center; }
.author-link{ display:flex; gap:10px; align-items:center; cursor:pointer; }
.author-link:hover strong{ text-decoration:underline; }

/* DM Drawer Overlay Styles */
.dm-drawer {
  position: fixed;
  top: 0;
  right: -360px;
  width: 340px;
  height: 100vh;
  background: white;
  box-shadow: -4px 0 20px rgba(0,0,0,0.3);
  z-index: 100;
  transition: right 0.3s ease;
  display: flex;
  flex-direction: column;
}
.dm-drawer.open { right: 0; }
.dm-header { padding: 14px; background: #333; color: white; display: flex; justify-content: space-between; align-items: center; }
.dm-body { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #f5f5f5; }
.dm-footer { padding: 10px; background: #eee; display: flex; gap: 8px; }
.dm-bubble { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.3; }
.dm-bubble.sent { align-self: flex-end; background: #547538; color: white; }
.dm-bubble.received { align-self: flex-start; background: #e0e0e0; color: black; }

/* Profile Modal Styles */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 90;
}
.modal-overlay.open { display: flex; }
.profile-modal {
  background: white;
  padding: 24px;
  border-radius: var(--radius);
  width: 90%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  text-align: center;
  position: relative;
}
.profile-modal .close-modal {
  position: absolute;
  top: 10px;
  right: 14px;
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">Qlix 2 (ALPHA)</div>
  <div style="margin-left:auto; display:flex; gap:8px;">
    <button class="btn" id="googleSignInBtn">Sign in with Google</button>
    <button class="btn" id="signOutBtn" style="display:none;">Sign Out</button>
  </div>
</header>

<main class="wrap">
  <aside>
    <div class="card user-card" id="userInfo" style="display:none;">
      <img id="userPic" class="profile-pic" style="width: 64px; height: 64px;" alt="Profile Picture">
      <strong id="userName"></strong>
    </div>
  </aside>

  <section>
    <div class="card composer" id="composer" style="display:none;">
      <textarea id="postText" placeholder="What's on your mind?"></textarea>
      <button class="btn primary" id="postBtn">Post</button>
    </div>
    <div class="feed" id="feed"></div>
  </section>
</main>

<!-- User Profile Modal -->
<div class="modal-overlay" id="profileModal">
  <div class="profile-modal">
    <button class="close-modal" id="closeProfileModal">✕</button>
    <img id="modalProfilePic" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #ccc;">
    <h3 id="modalProfileName" style="margin: 0;">User Name</h3>
    <p id="modalProfileSub" style="margin: 0; opacity: 0.6; font-size: 12px;">Qlix Member</p>
    <button class="btn primary" id="modalMessageBtn" style="width: 100%; margin-top: 10px;">✉ Send Message</button>
  </div>
</div>

<!-- In-Page DM Drawer -->
<div class="dm-drawer" id="dmDrawer">
  <div class="dm-header">
    <span id="dmTargetName">Chat</span>
    <button class="btn btn-sm" id="closeDmBtn" style="background:#555; color:white;">✕ Close</button>
  </div>
  <div class="dm-body" id="dmBody"></div>
  <div class="dm-footer">
    <input type="text" id="dmInput" placeholder="Type a message...">
    <button class="btn primary btn-sm" id="sendDmBtn">Send</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, serverTimestamp, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDP0yDxmCrcIXK_DkdXJZB_XzPRVPXMCyo",
  authDomain: "qlix-2701b.firebaseapp.com",
  projectId: "qlix-2701b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let activeChatUserId = null;
let dmUnsubscribe = null;
let currentProfileTarget = null;

// Auth
document.getElementById("googleSignInBtn").onclick = () => signInWithPopup(auth, provider);
document.getElementById("signOutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  currentUser = user;
  document.getElementById("googleSignInBtn").style.display = user ? "none" : "inline-block";
  document.getElementById("signOutBtn").style.display = user ? "inline-block" : "none";
  document.getElementById("composer").style.display = user ? "block" : "none";
  document.getElementById("userInfo").style.display = user ? "flex" : "none";
  if (user) {
    document.getElementById("userPic").src = user.photoURL || "https://via.placeholder.com/64";
    document.getElementById("userName").textContent = user.displayName || user.email;
  }
  fetchFeed();
});

// Profile Modal Handler
function openUserProfile(authorId, authorName, authorPic) {
  currentProfileTarget = { id: authorId, name: authorName, pic: authorPic };
  
  document.getElementById("modalProfilePic").src = authorPic || "https://via.placeholder.com/80";
  document.getElementById("modalProfileName").textContent = authorName;
  
  const msgBtn = document.getElementById("modalMessageBtn");
  if (currentUser && currentUser.uid === authorId) {
    msgBtn.style.display = "none"; // Can't message yourself
  } else {
    msgBtn.style.display = "block";
  }

  document.getElementById("profileModal").classList.add("open");
}

document.getElementById("closeProfileModal").onclick = () => {
  document.getElementById("profileModal").classList.remove("open");
};

document.getElementById("modalMessageBtn").onclick = () => {
  if (!currentProfileTarget) return;
  document.getElementById("profileModal").classList.remove("open");
  openChat(currentProfileTarget.id, currentProfileTarget.name);
};

// DM Functions
function openChat(targetUserId, targetUserName) {
  if (!currentUser) return alert("Please sign in to message users.");
  if (currentUser.uid === targetUserId) return alert("You cannot DM yourself.");

  activeChatUserId = targetUserId;
  document.getElementById("dmTargetName").textContent = `Chat with ${targetUserName}`;
  document.getElementById("dmDrawer").classList.add("open");

  if (dmUnsubscribe) dmUnsubscribe();

  const q = query(
    collection(db, "direct_messages"),
    where("participants", "array-contains", currentUser.uid)
  );

  dmUnsubscribe = onSnapshot(q, (snapshot) => {
    const dmBody = document.getElementById("dmBody");
    dmBody.innerHTML = "";

    const messages = [];
    snapshot.forEach(doc => {
      const data = doc.data();
      if (data.participants.includes(targetUserId)) {
        messages.push(data);
      }
    });

    messages.sort((a, b) => (a.timestamp?.toMillis() || Date.now()) - (b.timestamp?.toMillis() || Date.now()));

    messages.forEach(msg => {
      const bubble = document.createElement("div");
      bubble.className = `dm-bubble ${msg.senderId === currentUser.uid ? 'sent' : 'received'}`;
      bubble.textContent = msg.text;
      dmBody.appendChild(bubble);
    });

    dmBody.scrollTop = dmBody.scrollHeight;
  });
}

document.getElementById("closeDmBtn").onclick = () => {
  document.getElementById("dmDrawer").classList.remove("open");
  if (dmUnsubscribe) dmUnsubscribe();
};

document.getElementById("sendDmBtn").onclick = async () => {
  const input = document.getElementById("dmInput");
  const text = input.value.trim();
  if (!text || !activeChatUserId || !currentUser) return;

  await addDoc(collection(db, "direct_messages"), {
    senderId: currentUser.uid,
    receiverId: activeChatUserId,
    participants: [currentUser.uid, activeChatUserId],
    senderName: currentUser.displayName || currentUser.email,
    text: text,
    timestamp: serverTimestamp()
  });

  input.value = "";
};

// Feed & Posts
async function fetchFeed() {
  const feed = document.getElementById("feed");
  const snapshot = await getDocs(collection(db, "posts"));
  feed.innerHTML = "";

  const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  docs.sort((a, b) => (b.timestamp?.toMillis() || Date.now()) - (a.timestamp?.toMillis() || Date.now()));

  docs.forEach(data => {
    const div = document.createElement("div");
    div.className = "post";
    div.innerHTML = `
      <div class="author-link">
        <img class="profile-pic" src="${data.authorPic || 'https://via.placeholder.com/32'}">
        <strong>${data.authorName}</strong>
      </div>
      <p>${data.text}</p>
    `;

    // Click author name/pic to open profile
    const authorLink = div.querySelector(".author-link");
    authorLink.onclick = () => openUserProfile(data.authorId, data.authorName, data.authorPic);

    feed.appendChild(div);
  });
}

document.getElementById("postBtn").onclick = async () => {
  const input = document.getElementById("postText");
  if (!input.value.trim() || !currentUser) return;
  await addDoc(collection(db, "posts"), {
    text: input.value.trim(),
    authorName: currentUser.displayName || currentUser.email,
    authorId: currentUser.uid,
    authorPic: currentUser.photoURL,
    timestamp: serverTimestamp()
  });
  input.value = "";
  fetchFeed();
};
</script>
</body>
</html>
